<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain Registered - agamdhull.github.io</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    .icon-container {
      width: 72px;
      height: 72px;
      background-color: #e6f4ea;
      color: #137333;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px auto;
    }

    .material-symbols-outlined {
      font-size: 44px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .domain-name {
      font-size: 16px;
      color: #4b5563;
      background-color: #f3f4f6;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
      font-mono: monospace;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background-color: #0969da;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #0451a5;
    }

    /* Desktop-only QR Code Section */
    .qr-section {
      display: none; /* Hidden by default on mobile */
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px dashed #e5e7eb;
    }

    .qr-section p {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .qr-code {
      width: 140px;
      height: 140px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      padding: 6px;
      background: #ffffff;
    }

    /* Show QR Code only on Larger Screens / PC */
    @media (min-width: 768px) {
      .qr-section {
        display: block;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-container">
      <span class="material-symbols-outlined">check_circle</span>
    </div>
    
    <h1>Domain Registered</h1>
    <div class="domain-name">agamdhull.github.io</div>

    <a href="https://github.com/agamdhull/agamdhull.github.io" class="btn" target="_blank" rel="noopener">
      Manage Domain
    </a>

    <div class="qr-section">
      <p>Scan to manage domain</p>
      <img 
        class="qr-code" 
        src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://github.com/agamdhull/agamdhull.github.io" 
        alt="Scan to manage domain"
      />
    </div>
  </div>

</body>
</html>
