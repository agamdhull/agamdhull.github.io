<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Unavailable — Demo</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .notice {
      width: 100%;
      max-width: 680px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .demo {
      display: inline-block;
      background: #b42318;
      color: white;
      font-weight: 700;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
      letter-spacing: .3px;
    }

    .logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      margin-bottom: 25px;
    }

    .logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
    }

    h1 {
      font-size: clamp(24px, 6vw, 38px);
      margin: 10px 0 18px;
      line-height: 1.2;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #555;
      margin: 10px auto;
      max-width: 560px;
    }

    .warning {
      margin-top: 24px;
      padding: 16px;
      background: #fff7e6;
      border: 1px solid #ffd591;
      border-radius: 10px;
      color: #7a4b00;
      font-size: 14px;
      line-height: 1.5;
    }

    footer {
      margin-top: 25px;
      font-size: 13px;
      color: #888;
    }

    @media (max-width: 480px) {
      .notice {
        padding: 25px 17px;
      }

      .logos {
        gap: 18px;
      }

      .logo {
        width: 65px;
        height: 65px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="notice">

    <div class="demo">
      WEBSITE TAKEN DOWN
    </div>

    <div class="logos">
      <!-- Replace these with appropriately licensed assets for your mockup -->
      <img class="logo"
           src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg"
           alt="India Emblem">

      <img class="logo"
           src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
           alt="GitHub Logo">
    </div>

    <h1>Website Unavailable</h1>

    <p>
      This Website is taken down by Ministry of I.T., Government of India on suspect of illegal activities. Users are advised to not visit this website. - Issued in Public Intreset
    </p>

   

    <footer>
      &copy; Github Legal 2026
    </footer>

  </main>
</body>
</html>
